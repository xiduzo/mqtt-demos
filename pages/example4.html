<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 4 - Mic Windmill</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .windmill-container {
            position: relative;
            height: calc(100vh - 60px);
            background: linear-gradient(to bottom, #87ceeb 0%, #b8d4e8 60%, #90c695 60%, #5a8a5e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .windmill {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .windmill-head {
            position: relative;
            z-index: 2;
        }

        .blades-container {
            position: relative;
            width: 30vmin;
            height: 30vmin;
        }

        .blades {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .blade {
            position: absolute;
            width: 4vmin;
            height: 14vmin;
            background: linear-gradient(to right, #f5f5f5, #e0e0e0, #f5f5f5);
            border-radius: 2vmin 2vmin 0.5vmin 0.5vmin;
            left: 50%;
            top: 50%;
            transform-origin: center bottom;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .blade:nth-child(1) { transform: translateX(-50%) translateY(-100%) rotate(0deg); }
        .blade:nth-child(2) { transform: translateX(-50%) translateY(-100%) rotate(90deg); }
        .blade:nth-child(3) { transform: translateX(-50%) translateY(-100%) rotate(180deg); }
        .blade:nth-child(4) { transform: translateX(-50%) translateY(-100%) rotate(270deg); }

        .hub {
            position: absolute;
            width: 5vmin;
            height: 5vmin;
            background: radial-gradient(circle at 30% 30%, #8b4513, #5d2e0a);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .tower {
            width: 6vmin;
            height: 35vmin;
            background: linear-gradient(to right, #d4a574, #c49464, #d4a574);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            margin-top: -2vmin;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
        }

        .mic-indicator {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #2a5a2a;
            text-shadow: 0 1px 3px rgba(255,255,255,0.5);
        }

        .mic-level {
            font-size: 4rem;
            font-weight: 700;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .mic-label {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .mic-status {
            font-size: 1rem;
            margin-top: 0.5rem;
            opacity: 0.7;
        }

        .mic-button {
            margin-top: 1rem;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            background: #4a7c4e;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
            position: relative;
        }

        .mic-button:hover {
            background: #3a6a3e;
        }

        .mic-button.active {
            background: #c0392b;
        }

        .mic-button.active:hover {
            background: #a93226;
        }

        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60%;
            pointer-events: none;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            font-size: 5vmin;
            opacity: 0.8;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1));
        }

        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            overflow: hidden;
        }

        .grass-blade {
            width: 3px;
            height: 20px;
            background: #3a6a3e;
            transform-origin: bottom center;
            border-radius: 3px 3px 0 0;
        }

        .stats {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            color: #2a5a2a;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.7);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }

        .topic-display {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: #2a5a2a;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.7);
            padding: 0.3rem 0.8rem;
            border-radius: 0.3rem;
        }

        .level-bar {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 200px;
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        .level-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #4a7c4e, #7cb342);
            border-radius: 10px;
            transition: height 0.05s;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MQTT Examples</div>
    </nav>

    <main class="windmill-container">
        <div class="clouds" id="clouds"></div>
        
        <div class="mic-indicator">
            <div class="mic-level" id="micLevel">0</div>
            <div class="mic-label">🎤 Mic Level</div>
            <div class="mic-status" id="micStatus">Click to start</div>
        </div>

        <div class="windmill">
            <div class="windmill-head">
                <div class="blades-container">
                    <div class="blades" id="blades">
                        <div class="blade"></div>
                        <div class="blade"></div>
                        <div class="blade"></div>
                        <div class="blade"></div>
                    </div>
                    <div class="hub"></div>
                </div>
            </div>
            <div class="tower"></div>
            <button class="mic-button" id="micButton">Start Microphone</button>
        </div>

        <div class="grass" id="grass"></div>

        <div class="level-bar">
            <div class="level-fill" id="levelFill"></div>
        </div>

        <div class="stats">
            <div>Output: <span id="outputValue">--</span></div>
            <div>RPM: <span id="rpm">0</span></div>
        </div>

        <div class="topic-display">topic: sensor/value</div>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="../js/mqtt-client.js"></script>
    <script>
        const TOPIC = 'sensor/value';
        const MAX_VALUE = 360;

        const blades = document.getElementById('blades');
        const micLevelEl = document.getElementById('micLevel');
        const micStatusEl = document.getElementById('micStatus');
        const micButton = document.getElementById('micButton');
        const outputValueEl = document.getElementById('outputValue');
        const rpmEl = document.getElementById('rpm');
        const levelFill = document.getElementById('levelFill');
        const cloudsContainer = document.getElementById('clouds');
        const grassContainer = document.getElementById('grass');

        let currentRotation = 0;
        let currentSpeed = 0;
        let targetSpeed = 0;
        let lastValue = 0;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let isListening = false;

        // Generate clouds
        function generateClouds() {
            for (let i = 0; i < 5; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.textContent = '☁️';
                cloud.style.left = (Math.random() * 100) + '%';
                cloud.style.top = (Math.random() * 40 + 5) + '%';
                cloud.style.fontSize = (Math.random() * 4 + 3) + 'vmin';
                cloudsContainer.appendChild(cloud);
            }
        }
        generateClouds();

        // Generate grass
        function generateGrass() {
            for (let i = 0; i < 50; i++) {
                const blade = document.createElement('div');
                blade.className = 'grass-blade';
                blade.style.height = (Math.random() * 15 + 10) + 'px';
                grassContainer.appendChild(blade);
            }
        }
        generateGrass();

        function updateWindmill(value) {
            const clampedValue = Math.max(0, Math.min(MAX_VALUE, value));
            lastValue = clampedValue;
            
            targetSpeed = (clampedValue / MAX_VALUE) * 6;
            const rpm = Math.round((targetSpeed * 60 * 60) / 360);
            
            outputValueEl.textContent = Math.round(clampedValue);
            micLevelEl.textContent = Math.round(clampedValue);
            rpmEl.textContent = rpm;
            levelFill.style.height = (clampedValue / MAX_VALUE * 100) + '%';
        }

        // Main animation loop
        function animate() {
            const easing = 0.02;
            currentSpeed += (targetSpeed - currentSpeed) * easing;
            
            currentRotation += currentSpeed;
            if (currentRotation >= 360) currentRotation -= 360;
            blades.style.transform = `rotate(${currentRotation}deg)`;
            
            const windRatio = lastValue / MAX_VALUE;
            const grassBlades = grassContainer.querySelectorAll('.grass-blade');
            const swayAmount = windRatio * 30;
            grassBlades.forEach((blade, i) => {
                const offset = Math.sin(Date.now() / 200 + i) * swayAmount;
                blade.style.transform = `rotate(${offset}deg)`;
            });

            const clouds = cloudsContainer.querySelectorAll('.cloud');
            const cloudSpeed = windRatio * 0.1;
            clouds.forEach(cloud => {
                let left = parseFloat(cloud.style.left);
                left += cloudSpeed;
                if (left > 110) left = -10;
                cloud.style.left = left + '%';
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Microphone handling
        async function startMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;
                microphone.connect(analyser);
                
                isListening = true;
                micButton.textContent = 'Stop Microphone';
                micButton.classList.add('active');
                micStatusEl.textContent = '🔴 Listening...';
                
                processMicInput();
            } catch (err) {
                console.error('Microphone error:', err);
                micStatusEl.textContent = '❌ Mic access denied';
            }
        }

        function stopMicrophone() {
            isListening = false;
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            micButton.textContent = 'Start Microphone';
            micButton.classList.remove('active');
            micStatusEl.textContent = 'Click to start';
            updateWindmill(0);
        }

        function processMicInput() {
            if (!isListening) return;
            
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume
            const average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            
            // Map 0-128 average to 0-360
            const mappedValue = Math.round((average / 128) * MAX_VALUE);
            
            updateWindmill(mappedValue);
            
            // Publish to MQTT
            if (MQTTClient.isConnected()) {
                MQTTClient.publish(TOPIC, String(mappedValue));
            }
            
            requestAnimationFrame(processMicInput);
        }

        micButton.addEventListener('click', () => {
            if (isListening) {
                stopMicrophone();
            } else {
                startMicrophone();
            }
        });

        MQTTClient.on('onConnect', () => {
            micStatusEl.textContent = 'MQTT connected';
        });

        // Auto-start microphone
        startMicrophone();
    </script>
</body>
</html>
