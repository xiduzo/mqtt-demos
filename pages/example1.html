<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1 - MQTT Examples</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .fullscreen-value {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
            position: relative;
        }
        .fullscreen-value #value {
            font-size: 20vw;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Monaco', 'Menlo', monospace;
        }
        .topic-display {
            position: absolute;
            bottom: 2rem;
            color: var(--text-muted);
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MQTT Examples</div>
    </nav>

    <main class="fullscreen-value">
        <div id="value">--</div>
        <div class="topic-display">topic: sensor/value</div>
    </main>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="../js/mqtt-client.js"></script>
    <script>
        const TOPIC = 'sensor/value';
        const valueEl = document.getElementById('value');

        MQTTClient.on('onConnect', () => MQTTClient.subscribe(TOPIC));
        MQTTClient.on('onMessage', (topic, payload) => {
            if (topic === TOPIC) valueEl.textContent = payload;
        });

        if (MQTTClient.isConnected()) MQTTClient.subscribe(TOPIC);
    </script>
</body>
</html>
